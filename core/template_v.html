<!doctype html>
<html lang="zh-Hant" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "NotoTC"; src: url("assets/NotoSansTC-VF.ttf"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --coral: __PAL_coral__; --coral-rgb: __PAL_coral_rgb__; --hot: __PAL_hot__; --soft: __PAL_soft__; --on: __PAL_on__; --indigo: __PAL_indigo__; --cyan: __PAL_cyan__; --green: __PAL_green__; --red: __PAL_red__; --gold: __PAL_gold__; --ink: __PAL_ink__; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1020; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); font-family: "NotoTC", sans-serif; color: #fff; }
      .abs { position: absolute; inset: 0; }
      #bg { z-index: 1; background: #0b1020 url(assets/night.png) center / cover no-repeat; }
      #bg .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 40%, rgba(40,70,140,.35), rgba(8,10,22,.85) 75%); }
      .dot { position: absolute; border-radius: 50%; background: #fff; }
      #stage { z-index: __ST_Z__; inset: auto; left: __ST_X__px; top: __ST_Y__px; width: 1130px; height: 760px; transform: scale(__ST_S__); transform-origin: 0 0; overflow: hidden; }  /* 直式：圖解面板整個縮放放在下半部，面板內座標不變 */
      /* 口播視窗 */
      #vbox { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; z-index: 10; overflow: hidden; }
      #vdrift { position: absolute; inset: 0; transform-origin: 45% 40%; }
      #vid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: __CROPX__% __CROPY__%; }
      #vshade { position: absolute; inset: 0; z-index: 11; background: linear-gradient(180deg, rgba(8,10,22,.55) 0%, rgba(8,10,22,0) 22%, rgba(8,10,22,0) 55%, rgba(8,10,22,.82) 100%); }
      #vframe { position: absolute; left: __VF_X__px; top: __VF_Y__px; width: __VF_W__px; height: __VF_H__px; border-radius: 36px; border: 3px solid rgba(var(--coral-rgb),.9); box-shadow: 0 0 40px rgba(var(--coral-rgb),.35), inset 0 0 30px rgba(0,0,0,.4); z-index: 12; opacity: 0; pointer-events: none; }
      /* 圖解面板 */
      .pscene { position: absolute; left: 0px; top: 0px; width: 1130px; height: 760px; border-radius: 30px; overflow: hidden; opacity: 0; border: 2px solid rgba(160,200,255,.28); box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 40px rgba(95,208,255,.12); background: #0c1a33; z-index: 6; }
      .pscene .pbg { position: absolute; inset: 0; background: url(assets/panel.png) center / cover no-repeat; opacity: .95; }
      .pscene .ptint { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(10,22,52,.35), rgba(8,12,30,.55)); }
      .oscene { position: absolute; inset: 0; z-index: 14; opacity: 0; pointer-events: none; }
      .ovs { position: absolute; left: 0; top: 0; width: 1130px; height: 760px; overflow: visible; }
      .layer { position: absolute; left: 0; top: 0; width: 1130px; height: 760px; }
      .chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 10px 26px; border-radius: 18px; font-size: 40px; font-weight: 800; white-space: nowrap; opacity: 0; background: rgba(14,22,42,.82); border: 2px solid rgba(255,255,255,.22); box-shadow: 0 10px 26px rgba(0,0,0,.45); }
      .chip.c { border-left: 10px solid var(--coral); }
      .chip.i { border-left: 10px solid var(--indigo); }
      .chip.g { border-left: 10px solid var(--green); }
      .chip.r { border-left: 10px solid var(--red); }
      .chip.y { border-left: 10px solid var(--gold); }
      .chip.cy { border-left: 10px solid var(--cyan); }
      .lbl { position: absolute; font-size: 30px; font-weight: 800; color: #eaf4ff; text-shadow: 0 2px 8px rgba(0,0,0,.8); white-space: nowrap; opacity: 0; }
      .pin { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 14px var(--gold); opacity: 0; }
      .typh { position: absolute; left: 0; top: 0; opacity: 0; }
      .typh img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 18px rgba(160,210,255,.7)); }
      .ring { position: absolute; left: 0; top: 0; border-radius: 50%; border: 4px solid rgba(255,110,90,.85); background: radial-gradient(circle, rgba(255,80,60,.10) 40%, rgba(255,80,60,.26) 100%); opacity: 0; }
      .glass { position: absolute; background: rgba(14,22,42,.78); border: 2px solid rgba(255,255,255,.2); border-radius: 26px; box-shadow: 0 14px 40px rgba(0,0,0,.5); opacity: 0; }
      .bignum { position: absolute; font-weight: 900; line-height: 1; white-space: nowrap; opacity: 0; }
      .stampbox { position: absolute; padding: 8px 40px; border: 10px solid var(--coral); border-radius: 16px; color: var(--coral); font-size: 120px; font-weight: 900; letter-spacing: 6px; background: rgba(14,22,42,.7); white-space: nowrap; opacity: 0; }
      .drop { position: absolute; width: 4px; height: 38px; border-radius: 2px; background: linear-gradient(180deg, rgba(200,235,255,0), rgba(242,250,255,1)); opacity: 0; box-shadow: 0 0 6px rgba(190,225,255,.7); }
      /* 全域 UI */
      #hdr { position: absolute; left: 0; top: 0; width: 1080px; height: 190px; z-index: 30; pointer-events: none; }
      #logo { position: absolute; left: 40px; top: 96px; height: 66px; padding: 6px 20px; background: #fff; border-radius: 16px; display: flex; align-items: center; }
      #logo img { height: 52px; display: block; }
      #series { position: absolute; left: 350px; top: 102px; width: 440px; height: 52px; }
      #series img { position: absolute; inset: 0; width: 100%; height: 100%; }
      #series span { position: absolute; left: 66px; top: 0; height: 100%; display: flex; align-items: center; font-size: 28px; font-weight: 900; color: var(--on); letter-spacing: 3px; }
      #badge { position: absolute; left: 950px; top: 86px; width: 86px; height: 86px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
      .topic { position: absolute; left: 62px; top: __TOPIC_Y__px; padding: 6px 26px; border-radius: 40px; background: linear-gradient(90deg, var(--coral), var(--hot)); color: var(--on); font-size: 34px; font-weight: 900; opacity: 0; white-space: nowrap; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
      #name { position: absolute; left: 0; top: 0; width: 640px; height: 69px; z-index: 31; opacity: 0; }
      #name img { position: absolute; inset: 0; width: 100%; height: 100%; }
      #name span { position: absolute; left: 150px; top: 0; height: 100%; display: flex; align-items: center; gap: 14px; padding-bottom: 6px; white-space: nowrap; }
      #name .r { font-size: 26px; font-weight: 700; color: var(--soft); }
      #name .n { font-size: 44px; font-weight: 900; letter-spacing: 5px; }
      #capbox { position: absolute; left: 30px; right: 30px; top: __CAP_Y__px; height: __CAP_H__px; overflow: hidden; z-index: 32; }
      .cap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .pill { display: inline-block; max-width: 100%; overflow: hidden; padding: 12px 40px; background: rgba(12,16,30,.8); border-radius: 26px; font-weight: 900; letter-spacing: 2px; white-space: nowrap; text-shadow: 0 3px 10px rgba(0,0,0,.5); border-bottom: 6px solid var(--coral); }
      .cc { display: inline-block; color: #fff; }
      #prog { position: absolute; left: 40px; top: 1858px; width: 1000px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.14); z-index: 32; overflow: hidden; }
      #pfill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--indigo), var(--coral)); transform-origin: left center; }
      #fx { z-index: 40; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%); }
      #grain { position: absolute; left: -200px; top: -200px; width: 2400px; height: 1500px; opacity: .08; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      #flash { z-index: 70; background: #fff; opacity: 0; pointer-events: none; }
      #opener { z-index: 25; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 50%, rgba(18,28,60,.9), rgba(6,8,18,.96)); }
      #opener .t1 { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-size: 124px; font-weight: 900; white-space: nowrap; }
      #opener .t2 { position: absolute; left: 0; right: 0; top: 890px; text-align: center; font-size: 52px; font-weight: 800; color: var(--soft); letter-spacing: 12px; }
      .oc { display: inline-block; }
      .endl { position: absolute; inset: 0; }
      #endA { z-index: 100; background: var(--coral); clip-path: polygon(0% 0%, 0% 0%, 0% 0%); }
      #endB { z-index: 101; background: radial-gradient(circle at 50% 40%, #232a3d, #0d0f16 72%); clip-path: polygon(0% 0%, 0% 0%, 0% 0%); overflow: hidden; }
      #elogo { position: absolute; left: 160px; top: 520px; width: 760px; padding: 30px 44px; background: #fff; border-radius: 36px; overflow: hidden; }
      #elogo img { width: 100%; display: block; }
      #sweep { position: absolute; top: -20px; left: 0; width: 140px; height: 360px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,170,150,.85), rgba(255,255,255,0)); transform: skewX(-20deg); }
      #e1 { position: absolute; left: 0; right: 0; top: 920px; text-align: center; font-size: 80px; font-weight: 900; white-space: nowrap; }
      #e2 { position: absolute; left: 0; right: 0; top: 1050px; text-align: center; font-size: 46px; font-weight: 700; color: var(--soft); }
      #e3 { position: absolute; left: 0; right: 0; top: 1140px; text-align: center; font-size: 34px; font-weight: 700; color: rgba(255,255,255,.6); }
      .ec { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920">
      <div id="bg" class="abs"><div class="shade"></div></div>
      <div id="stage" class="abs"></div>

      <div id="vbox">
        <div id="vdrift">
          <video id="vid" class="clip" src="assets/long.mp4" playsinline data-has-audio="true" data-start="__H__" data-duration="__DUR__" data-track-index="1" data-volume="1"></video>
        </div>
        <div id="vshade"></div>
      </div>
      <div id="vframe"></div>
      
      <div id="hdr">
        <div id="logo"><img src="assets/logo.png" alt="中時新聞網" /></div>
        <div id="series"><img src="assets/plate.png" alt="" /><span>__SERIES__</span></div>
        <img id="badge" src="assets/badge.png" alt="" />
      </div>
      <div id="name"><img src="assets/nameplate.png" alt="" /><span><b class="r">__ROLE__</b><b class="n">__SPEAKER__</b></span></div>
      <div id="capbox"></div>
      <div id="prog"><div id="pfill"></div></div>
      <div id="ovl" class="abs" style="z-index:14"></div>

      <div id="fx" class="abs"><div id="grain"></div></div>
      <div id="flash" class="abs"></div>
      <div id="opener" class="abs"><div class="t1"></div><div class="t2">__OPENER_SUB__</div></div>

      <div id="endA" class="endl"></div>
      <div id="endB" class="endl">
        <div id="elogo"><img src="assets/logo.png" alt="中時新聞網" /><div id="sweep"></div></div>
        <div id="e1"></div>
        <div id="e2">__END2__</div>
        <div id="e3">__END3__</div>
      </div>

      <audio id="bgm" src="assets/bgm.m4a" data-start="__H__" data-duration="__MT__" data-track-index="2" data-volume="0.8"></audio>
      <!--__HOOKHTML__-->
    </div>
    <script>
      (function () {
        const C = __CFG__;
        const L = C.lines, D = C.dur, T = C.total;
        const $ = (s, p) => (p || document).querySelector(s);
        const stage = $("#stage");
        function mk(tag, cls, parent, html, css) {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (html != null) e.innerHTML = html;
          if (css) e.style.cssText = css;
          (parent || $("#root")).appendChild(e);
          return e;
        }
        function rng(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        const NS = "http://www.w3.org/2000/svg";
        function se(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
        let tl = gsap.timeline({ paused: true });
        const H = __H__;
        const LN = (n) => L[n - 1];
        const keepc = (s) => [...s].filter((c) => /[一-鿿A-Za-z0-9]/.test(c)).join("");
        // 句內關鍵字的起始／結束時間（依字數比例）
        function tw(n, key) { const l = LN(n), ch = keepc(l.text), i = ch.indexOf(keepc(key)); return i < 0 ? l.t0 : l.t0 + ((l.t1 - l.t0) * i) / ch.length; }
        function te(n, key) { const l = LN(n), ch = keepc(l.text), k = keepc(key), i = ch.indexOf(k); return i < 0 ? l.t1 : l.t0 + ((l.t1 - l.t0) * (i + k.length)) / ch.length; }
        const T0 = (n) => LN(n).t0, T1 = (n) => LN(n).t1;

        /*__CORE__*/

        /*__FINAL__*/
      })();
    </script>
  </body>
</html>
